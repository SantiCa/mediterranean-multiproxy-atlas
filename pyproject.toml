[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medatlas"
version = "0.2.0"
description = "Provenance-first connectors and data model for global georeferenced paleoclimate records"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mediterranean Multiproxy Atlas contributors" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["seed_query"]

[tool.setuptools.packages.find]
where = ["src"]
