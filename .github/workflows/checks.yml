name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      # Public services are checked explicitly, never as a dependency of offline CI.
      # Seed integrity is skipped until the ignored source originals are downloaded.
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
