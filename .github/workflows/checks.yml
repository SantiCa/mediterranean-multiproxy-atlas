name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      # Public services are checked explicitly, never as a dependency of offline CI.
      # Seed integrity is skipped until the ignored source originals are downloaded.
      # One process per test file: several suites keep a full seed (~70 MB JSON, ~1 GB
      # parsed) in class attributes, and a single process ran out of memory.
      - shell: bash
        run: |
          fail=0
          for f in tests/test_*.py; do
            python -m unittest discover -s tests -p "$(basename "$f")" || { echo "::error title=Prueba::$f"; fail=1; }
          done
          exit $fail
      - run: python -m compileall -q src scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test app/atlas-web/tests/science.test.mjs app/atlas-web/tests/timeline.test.mjs app/atlas-web/tests/proxies.test.mjs
