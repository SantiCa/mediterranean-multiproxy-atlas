name: Deploy web to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'app/atlas-web/**'
      - 'data/processed/atlas-v*.json'
      - 'config/qc_corrections.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/atlas-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Web tests
        run: node --test tests/*.test.mjs
      - name: Build and verify public catalogue
        run: |
          seed="$(git -C ../.. ls-files 'data/processed/atlas-v*.json' | sort -V | tail -1)"
          test -n "$seed"
          python3 ../../scripts/audit_science.py "../../$seed" > audit.log || { cat audit.log; exit 1; }
          node scripts/build-public-viewer.mjs "../../$seed"
      - name: Publish static assets to the existing Worker
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured; skipping publication."
            exit 0
          fi
          npx --no-install wrangler deploy --config wrangler.public.json
          echo "done=true" >> "$GITHUB_OUTPUT"
      - name: Verify the public hostname and API separation
        if: steps.publish.outputs.done == 'true'
        run: |
          url="https://med.proxyatlas.workers.dev"
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 15 "$url/" --output /dev/null &&
              curl --silent --show-error --fail --max-time 15 "$url/snapshot/catalog.json" --output live.json &&
              cmp -s live.json dist-public/snapshot/catalog.json &&
              [ "$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$url/api/candidates")" = 404 ]; then
              echo "### Visor público: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::La URL pública no sirve aún el catálogo esperado o conserva la API anterior."
          exit 1
