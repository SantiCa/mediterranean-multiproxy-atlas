name: Deploy web to Cloudflare
# Self-hosted deployment independent of ChatGPT Sites (docs/DEPLOY_CLOUDFLARE.md).
# Runs on every push to main that touches the web, or by hand from the Actions tab.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without
# them the job stops early with a notice instead of failing.
on:
  push:
    branches: [main]
    paths: ['app/atlas-web/**', 'data/processed/atlas-v*.json', 'scripts/d1_release.py', '.github/workflows/deploy-cloudflare.yml']
  workflow_dispatch:
  # Daily, just after the D1 Free limits reset (00:00 UTC): resumes a release load
  # that exceeded 100 000 rows written/day. Build and deploy are skipped on schedule.
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  # Public URL: https://$WORKER_NAME.$SUBDOMAIN.workers.dev (med.proxyatlas, chosen by Santiago).
  # DB_NAME stays medatlas so the loaded data is reused.
  WORKER_NAME: med
  DB_NAME: medatlas
  SUBDOMAIN: proxyatlas

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/atlas-web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: gate
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/atlas-web/package-lock.json

      - name: Install
        if: steps.gate.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund

      - name: Scientific contract tests
        if: steps.gate.outputs.ok == 'true'
        run: node --test tests/science.test.mjs tests/timeline.test.mjs tests/proxies.test.mjs

      # Create the D1 database on first run; reuse it afterwards (looked up by name).
      - name: Resolve D1 database
        if: steps.gate.outputs.ok == 'true'
        id: db
        run: |
          # Secrets pasted from a browser often carry a trailing newline/space.
          # Drop whitespace, quotes/backticks and an accidental "Bearer" prefix.
          CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]"`'"'" | sed 's/^Bearer//')"
          # Keep only the 32-hex account id, in case it was pasted with quotes/backticks.
          raw_account="$CLOUDFLARE_ACCOUNT_ID"
          CLOUDFLARE_ACCOUNT_ID="$(printf %s "$raw_account" | grep -Eio '[0-9a-f]{32}' | head -1 || true)"
          echo "::notice title=Account ID::secreto de ${#raw_account} car.; id usado: ${CLOUDFLARE_ACCOUNT_ID:-NINGUNO}"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error title=Account ID::CLOUDFLARE_ACCOUNT_ID no contiene un id de 32 caracteres hexadecimales."; exit 1; }
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          # Later wrangler steps reuse the cleaned (non-secret) account id.
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "Longitudes: token=${#CLOUDFLARE_API_TOKEN} account=${#CLOUDFLARE_ACCOUNT_ID}"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          call() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          fail() { echo "::error title=Cloudflare D1::$1"; exit 1; }
          pick() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let j;try{j=JSON.parse(s)}catch{console.log("ERR:respuesta no JSON");return}if(!j.success){console.log("ERR:"+JSON.stringify(j.errors));return}const r=j.result;const m=Array.isArray(r)?r.find(d=>d.name===process.argv[1]):r;console.log(m?m.uuid:"")})' "$DB_NAME"; }
          raw="$(call -w '\nHTTP %{http_code}' "$api?name=$DB_NAME" || true)"
          code="$(printf '%s' "$raw" | tail -1)"
          body="$(printf '%s' "$raw" | sed '$d')"
          echo "$code"
          out="$(printf '%s' "$body" | pick)"
          case "$out" in ERR:*) echo "::error title=Cloudflare respuesta::$code ${body:0:300}" ;; esac
          case "$out" in ERR:*) fail "No se puede listar D1 ($out). Revisa que el token tenga Account > D1 > Edit y que CLOUDFLARE_ACCOUNT_ID sea el de esa cuenta." ;; esac
          if [ -z "$out" ]; then
            out="$(call -X POST "$api" -d "{\"name\":\"$DB_NAME\"}" | pick)"
            case "$out" in ERR:*) fail "No se puede crear D1 ($out)." ;; esac
          fi
          test -n "$out" || fail "No se obtuvo el id de la base D1."
          echo "id=$out" >> "$GITHUB_OUTPUT"

      # Schema is owned by the versioned drizzle/*.sql migrations; never DDL from requests.
      - name: Apply D1 migrations
        if: steps.gate.outputs.ok == 'true'
        run: |
          cat > wrangler.migrations.json <<EOF
          {"name":"$WORKER_NAME","d1_databases":[{"binding":"DB","database_name":"$DB_NAME","database_id":"${{ steps.db.outputs.id }}","migrations_dir":"drizzle"}]}
          EOF
          if ! npx wrangler d1 migrations apply "$DB_NAME" --remote --config wrangler.migrations.json > migrate.log 2>&1; then
            cat migrate.log
            echo "::error title=Migraciones D1::$(grep -iE 'error|✘' migrate.log | tail -3 | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi
          tail -5 migrate.log

      - name: Build
        if: steps.gate.outputs.ok == 'true' && github.event_name != 'schedule'
        env:
          CF_WORKER_NAME: ${{ env.WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ env.DB_NAME }}
          CF_D1_DATABASE_ID: ${{ steps.db.outputs.id }}
        run: npx vinext build

      - name: Deploy Worker
        if: steps.gate.outputs.ok == 'true' && github.event_name != 'schedule'
        run: npx wrangler deploy --config dist/server/wrangler.json

      # Owner password for the private area («Mis datos»), from the GitHub secret
      # ATLAS_OWNER_PASSWORD. Never printed; skipped when the secret is absent.
      - name: Owner password secret
        if: steps.gate.outputs.ok == 'true' && github.event_name != 'schedule'
        env:
          OWNER_PASSWORD: ${{ secrets.ATLAS_OWNER_PASSWORD }}
        run: |
          if [ -z "$OWNER_PASSWORD" ]; then echo "::notice title=Mis datos::Sin ATLAS_OWNER_PASSWORD; el área privada queda desactivada."; exit 0; fi
          [ ${#OWNER_PASSWORD} -ge 12 ] || { echo "::warning title=Mis datos::ATLAS_OWNER_PASSWORD debe tener al menos 12 caracteres"; exit 0; }
          printf %s "$OWNER_PASSWORD" | npx wrangler secret put OWNER_PASSWORD --name "$WORKER_NAME" > /dev/null && echo "::notice title=Mis datos::Contraseña del área privada actualizada."

      # Give the Worker a public workers.dev URL: register the account subdomain on
      # first use (SUBDOMAIN below) and enable workers.dev for this script.
      - name: Enable workers.dev URL
        if: steps.gate.outputs.ok == 'true' && github.event_name != 'schedule'
        id: deploy
        run: |
          T="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$T"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          call() { curl -sS -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$@"; }
          field() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success){console.log("ERR:"+JSON.stringify(j.errors));return}console.log((j.result&&j.result[process.argv[1]])??"")}catch{console.log("ERR:no JSON")}})' "$1"; }
          sub="$(call "$api/subdomain" | field subdomain)"
          case "$sub" in ERR:*) sub="";; esac
          # Register or rename the account subdomain to SUBDOMAIN. Renaming changes the
          # URL of every Worker in the account. If the name is taken, keep the current one.
          if [ "$sub" != "$SUBDOMAIN" ]; then
            put() { call -X PUT "$api/subdomain" -d "{\"subdomain\":\"$1\"}" | field subdomain; }
            new="$(put "$SUBDOMAIN")"
            # Cloudflare refuses a rename (10036); delete the account subdomain and
            # register the new one, restoring the previous name if that fails.
            case "$new" in *10036*)
              call -X DELETE "$api/subdomain" >/dev/null || true
              new="$(put "$SUBDOMAIN")"
              case "$new" in ERR:*|"") [ -n "$sub" ] && put "$sub" >/dev/null;; esac ;;
            esac
            case "$new" in
              ERR:*|"") echo "::warning title=workers.dev::No se pudo usar '$SUBDOMAIN' ($new); se mantiene '${sub:-ninguno}'.";;
              *) sub="$new";;
            esac
          fi
          [ -n "$sub" ] || { echo "::error title=workers.dev::No se pudo registrar el subdominio de la cuenta."; exit 1; }
          r="$(call -X POST "$api/scripts/$WORKER_NAME/subdomain" -d '{"enabled":true,"previews_enabled":false}' | field enabled)"
          case "$r" in ERR:*) echo "::error title=workers.dev::No se pudo activar ($r)"; exit 1;; esac
          url="https://$WORKER_NAME.$sub.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Atlas desplegado::$url"
          echo "### Atlas desplegado: $url" >> "$GITHUB_STEP_SUMMARY"
          # A newly enabled subdomain can take a minute to resolve.
          # A new workers.dev hostname can take several minutes to start routing.
          for i in $(seq 1 60); do curl -s -o /dev/null -w '%{http_code}' "$url/api/catalog" | grep -q 200 && break; sleep 10; done

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ok == 'true'
        with:
          python-version: '3.12'

      - name: Public URL
        if: steps.gate.outputs.ok == 'true'
        id: url
        run: echo "url=${{ steps.deploy.outputs.url || format('https://{0}.{1}.workers.dev', env.WORKER_NAME, env.SUBDOMAIN) }}" >> "$GITHUB_OUTPUT"

      # Releases are written to D1 from here (scripts/d1_release.py), not bundled in the
      # Worker. Append-only and resumable: a run that hits the daily row-write limit
      # stops with a warning; the web keeps serving the last complete release.
      - name: Load releases into D1
        if: steps.gate.outputs.ok == 'true'
        run: |
          S="--seed ../../data/processed/atlas-v3.json --seed ../../data/processed/atlas-v4.json --seed ../../data/processed/atlas-v5.json"
          q() { npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.migrations.json --json --command "$1"; }
          q "SELECT series_id,count(*) n FROM atlas_observations GROUP BY series_id" > counts.json
          python ../../scripts/d1_release.py plan $S --counts counts.json --out-dir d1plan | tee plan.log
          loaded=0; partial=""
          for f in d1plan/*.sql; do
            [ -e "$f" ] || break
            if npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.migrations.json --file "$f" -y > exec.log 2>&1; then
              loaded=$((loaded+1))
            else
              partial="$f: $(grep -iE 'error|✘' exec.log | tail -2 | tr '\n' ' ' | cut -c1-300)"; tail -5 exec.log; break
            fi
          done
          q "SELECT series_id,count(*) n FROM atlas_observations GROUP BY series_id" > counts.json
          q "SELECT id FROM atlas_releases" > releases.json
          python ../../scripts/d1_release.py finalize $S --counts counts.json --releases releases.json --out final.sql | tee final.log
          if [ -s final.sql ]; then npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.migrations.json --file final.sql -y > final_exec.log 2>&1 || { tail -5 final_exec.log; echo "::warning title=Carga D1::no se pudo registrar la release (se reintenta mañana): $(grep -iE 'error|✘' final_exec.log | tail -2 | tr '\n' ' ' | cut -c1-300)"; }; fi
          if [ -n "$partial" ]; then
            echo "::warning title=Carga D1 parcial::$loaded lotes cargados; se detuvo en $partial (probable límite diario Free). Se reanuda en la ejecución diaria. $(cat final.log)"
          else
            echo "::notice title=Carga D1::$(cat plan.log) · $(cat final.log)"
          fi

      - name: Load inventory
        if: steps.gate.outputs.ok == 'true'
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          node --input-type=module -e '
          const base = process.env.URL;
          let body = { offset: 0 };
          for (let i = 0; i < 5000; i++) {
            let r;
            // Retry while a fresh workers.dev route still answers with the Cloudflare 404 page.
            for (let t = 0; t < 30; t++) {
              r = await fetch(base + "/api/inventory", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
              if (r.status !== 404) break;
              await new Promise(ok => setTimeout(ok, 10000));
            }
            const text = await r.text();
            let p = {}; try { p = JSON.parse(text); } catch {}
            if (!r.ok) { console.log("::warning title=Inventario::HTTP " + r.status + ": " + (p.error || text.replace(/\s+/g, " ").slice(0, 300))); process.exit(0); }
            if (p.ready) { console.log("inventory ready"); process.exit(0); }
            body = { offset: p.next };
          }
          '

      # Cell-by-cell check of every served observation against its versioned seed.
      - name: Validate deployed API against seed
        if: steps.gate.outputs.ok == 'true'
        working-directory: .
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          if python scripts/validate_quantitative_api.py --url "$URL" --public-https --seed data/processed/atlas-v3.json --seed data/processed/atlas-v4.json --seed data/processed/atlas-v5.json > validate.log 2>&1; then
            echo "::notice title=Validación::$(tail -1 validate.log)"
          else
            cat validate.log
            echo "::error title=Validación::$(tail -3 validate.log | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi
